# Firebase App Hosting configuration for Next.js SSR
# https://firebase.google.com/docs/app-hosting

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  # Firebase Client Configuration (public)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAoW2qOW-eJa9CLso6ZTcTuHLBhqwfKlc0
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: tagency-ai.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: tagency-ai
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: tagency-ai.firebasestorage.app
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "581159511530"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:581159511530:web:7a093b050ba446c87bbe93

  # Application Configuration
  - variable: NEXT_PUBLIC_APP_NAME
    value: Travel Agency SaaS
  - variable: NEXT_PUBLIC_DEFAULT_LOCALE
    value: ar

  # Firebase Admin SDK
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: tagency-ai
  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    value: firebase-adminsdk-fbsvc@tagency-ai.iam.gserviceaccount.com

  # Secrets (will be configured via Firebase Secret Manager)
  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: firebase-admin-private-key
  - variable: STRIPE_SECRET_KEY
    secret: stripe-secret-key
