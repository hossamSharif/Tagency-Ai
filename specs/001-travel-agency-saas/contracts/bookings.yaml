# Bookings API Contract
# Travel Agency SaaS - Booking Lifecycle

openapi: 3.1.0
info:
  title: Bookings API
  version: 1.0.0
  description: |
    Booking creation, management, and document handling.
    Server Actions in `src/app/actions/bookings.ts`

components:
  schemas:
    BookingStatus:
      type: string
      enum: [pending, confirmed, in_progress, completed, cancelled]

    PaymentStatus:
      type: string
      enum: [unpaid, partial, paid]

    DocumentStatus:
      type: string
      enum: [pending, uploaded, verified, rejected]

    TravelerInput:
      type: object
      required:
        - firstName
        - lastName
      properties:
        firstName:
          type: string
        lastName:
          type: string
        isPrimary:
          type: boolean
          default: false
        passport:
          $ref: '#/components/schemas/PassportData'

    PassportData:
      type: object
      properties:
        passportNumber:
          type: string
        fullName:
          type: string
        dateOfBirth:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        nationality:
          type: string
        gender:
          type: string
          enum: [M, F]
        issuingCountry:
          type: string
        extractionConfidence:
          type: number
          minimum: 0
          maximum: 100
        manuallyVerified:
          type: boolean

    CreateBookingInput:
      type: object
      required:
        - customerId
        - packageId
        - travelers
      properties:
        customerId:
          type: string
        packageId:
          type: string
        travelers:
          type: array
          items:
            $ref: '#/components/schemas/TravelerInput'
          minItems: 1
        travelDate:
          type: string
          format: date
          description: Defaults to package startDate
        notes:
          type: string
        source:
          type: string
          enum: [web, walk-in, phone]
          default: web

    UpdateBookingInput:
      type: object
      properties:
        travelers:
          type: array
          items:
            $ref: '#/components/schemas/TravelerInput'
        travelDate:
          type: string
          format: date
        notes:
          type: string

    Booking:
      type: object
      properties:
        id:
          type: string
        bookingNumber:
          type: string
        customerId:
          type: string
        customerName:
          type: string
        packageId:
          type: string
        packageName:
          type: string
        travelers:
          type: array
          items:
            $ref: '#/components/schemas/TravelerInput'
        status:
          $ref: '#/components/schemas/BookingStatus'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        bookingDate:
          type: string
          format: date-time
        travelDate:
          type: string
          format: date-time
        totalAmount:
          type: number
        paidAmount:
          type: number
        balance:
          type: number
        currency:
          type: string
        invoiceId:
          type: string
        requiredDocuments:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              status:
                $ref: '#/components/schemas/DocumentStatus'
              documentId:
                type: string
        createdAt:
          type: string
          format: date-time

    BookingWithDetails:
      allOf:
        - $ref: '#/components/schemas/Booking'
        - type: object
          properties:
            packageSnapshot:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
                services:
                  type: array
                  items:
                    type: object
                totalPrice:
                  type: number
            invoice:
              type: object
              description: Invoice summary

paths:
  /bookings:
    get:
      operationId: listBookings
      summary: List bookings
      description: |
        Firestore query with filters.
        Client hook: `useBookings(filters)`
      security:
        - firebase: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BookingStatus'
        - name: customerId
          in: query
          schema:
            type: string
        - name: packageId
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Booking list
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
                  nextCursor:
                    type: string

    post:
      operationId: createBooking
      summary: Create new booking
      description: |
        Server Action: `createBookingAction`
        - Validates package availability
        - Creates package snapshot
        - Generates booking number
        - Creates draft invoice
        Requires: admin, staff, or customer role
      security:
        - firebase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingInput'
      responses:
        '200':
          description: Booking created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      bookingId:
                        type: string
                      bookingNumber:
                        type: string
                      invoiceId:
                        type: string
        '400':
          description: Package unavailable or capacity exceeded

  /bookings/{bookingId}:
    parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string

    get:
      operationId: getBooking
      summary: Get booking details
      security:
        - firebase: []
      responses:
        '200':
          description: Booking with full details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingWithDetails'

    patch:
      operationId: updateBooking
      summary: Update booking
      description: |
        Server Action: `updateBookingAction`
        Only allowed for pending/confirmed bookings.
      security:
        - firebase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookingInput'
      responses:
        '200':
          description: Booking updated
        '400':
          description: Cannot update booking in current status

  /bookings/{bookingId}/status:
    parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string

    post:
      operationId: updateBookingStatus
      summary: Change booking status
      description: |
        Server Action: `updateBookingStatusAction`
        Valid transitions:
        - pending → confirmed (payment received or manual)
        - pending → cancelled
        - confirmed → in_progress (travel date reached)
        - confirmed → cancelled (before travel)
        - in_progress → completed (travel ended)
      security:
        - firebase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  $ref: '#/components/schemas/BookingStatus'
                reason:
                  type: string
                  description: Required for cancellation
      responses:
        '200':
          description: Status updated
        '400':
          description: Invalid state transition

  /bookings/{bookingId}/travelers/{travelerIndex}/passport:
    parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
      - name: travelerIndex
        in: path
        required: true
        schema:
          type: integer

    post:
      operationId: updateTravelerPassport
      summary: Update traveler passport data
      description: |
        Server Action: `updateTravelerPassportAction`
        Used after OCR extraction or manual entry.
      security:
        - firebase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassportData'
      responses:
        '200':
          description: Passport data updated

  /bookings/{bookingId}/documents:
    parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string

    post:
      operationId: uploadDocument
      summary: Upload document for booking
      description: |
        Server Action: `uploadBookingDocumentAction`
        - Upload to Firebase Storage
        - Update document status to 'uploaded'
        - Trigger OCR for passport documents
      security:
        - firebase: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - documentType
                - file
              properties:
                documentType:
                  type: string
                  enum: [passport, visa, photo, vaccination, other]
                file:
                  type: string
                  format: binary
                travelerIndex:
                  type: integer
                  description: Which traveler this document belongs to
      responses:
        '200':
          description: Document uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      documentId:
                        type: string
                      url:
                        type: string
                      ocrResult:
                        $ref: '#/components/schemas/PassportData'
                        description: Only for passport documents

  /bookings/{bookingId}/documents/{documentId}/verify:
    parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
      - name: documentId
        in: path
        required: true
        schema:
          type: string

    post:
      operationId: verifyDocument
      summary: Verify or reject document
      description: |
        Server Action: `verifyDocumentAction`
        Staff/admin reviews uploaded documents.
      security:
        - firebase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [verified, rejected]
                rejectionReason:
                  type: string
                  description: Required if status is rejected
      responses:
        '200':
          description: Document status updated

  /bookings/{bookingId}/request-documents:
    parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string

    post:
      operationId: requestDocuments
      summary: Request documents from customer
      description: |
        Server Action: `requestDocumentsAction`
        Sends notification to customer.
      security:
        - firebase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - documentTypes
              properties:
                documentTypes:
                  type: array
                  items:
                    type: string
                    enum: [passport, visa, photo, vaccination, other]
                message:
                  type: string
                  description: Custom message for customer
      responses:
        '200':
          description: Document request sent

  /ocr/passport:
    post:
      operationId: extractPassportData
      summary: Extract data from passport image
      description: |
        API Route: `/api/ocr/passport`
        Uses Tesseract.js for OCR.
        Can be called before creating booking.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Passport image (JPEG, PNG, or PDF)
      responses:
        '200':
          description: Extracted passport data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/PassportData'
                  rawText:
                    type: string
                    description: Raw OCR output for debugging
        '400':
          description: Unable to extract data
