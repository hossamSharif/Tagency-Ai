# Packages & Services API Contract
# Travel Agency SaaS - Tourism Package Management

openapi: 3.1.0
info:
  title: Packages API
  version: 1.0.0
  description: |
    Package and service management operations.
    Server Actions in `src/app/actions/packages.ts`

components:
  schemas:
    PackageType:
      type: string
      enum: [hajj, umrah, honeymoon, custom]

    PackageStatus:
      type: string
      enum: [draft, active, completed, cancelled]

    ServiceCategory:
      type: string
      enum: [flight, hotel, visa, transport, guide, meal, other]

    DocumentType:
      type: string
      enum: [passport, visa, photo, vaccination, other]

    CreatePackageInput:
      type: object
      required:
        - name
        - type
        - startDate
        - endDate
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        type:
          $ref: '#/components/schemas/PackageType'
        description:
          type: string
          maxLength: 5000
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        basePrice:
          type: number
          minimum: 0
        coverImage:
          type: string
          format: uri
          description: Firebase Storage URL
        maxCapacity:
          type: integer
          minimum: 1
        requiredDocuments:
          type: array
          items:
            $ref: '#/components/schemas/DocumentType'

    UpdatePackageInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        basePrice:
          type: number
        coverImage:
          type: string
        maxCapacity:
          type: integer
        requiredDocuments:
          type: array
          items:
            $ref: '#/components/schemas/DocumentType'
        highlights:
          type: array
          items:
            type: string

    AddServiceInput:
      type: object
      required:
        - name
        - category
        - price
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        category:
          $ref: '#/components/schemas/ServiceCategory'
        description:
          type: string
        price:
          type: number
          minimum: 0
        serviceDate:
          type: string
          format: date-time
        duration:
          type: number
          description: Duration in hours
        provider:
          type: string
          description: Hotel name, airline, etc.
        isOutsourced:
          type: boolean
          default: false
        partnerOfficeId:
          type: string
          description: Required if isOutsourced is true
        commissionPercentage:
          type: number
          minimum: 0
          maximum: 100
          description: Required if isOutsourced is true

    Package:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        type:
          $ref: '#/components/schemas/PackageType'
        description:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        duration:
          type: integer
        basePrice:
          type: number
        totalPrice:
          type: number
        currency:
          type: string
        coverImage:
          type: string
        status:
          $ref: '#/components/schemas/PackageStatus'
        maxCapacity:
          type: integer
        currentBookings:
          type: integer
        requiredDocuments:
          type: array
          items:
            $ref: '#/components/schemas/DocumentType'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Service:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          $ref: '#/components/schemas/ServiceCategory'
        description:
          type: string
        price:
          type: number
        serviceDate:
          type: string
          format: date-time
        duration:
          type: number
        provider:
          type: string
        isOutsourced:
          type: boolean
        partnerOfficeId:
          type: string
        partnerOfficeName:
          type: string
        commissionPercentage:
          type: number
        displayOrder:
          type: integer

    PackageWithServices:
      allOf:
        - $ref: '#/components/schemas/Package'
        - type: object
          properties:
            services:
              type: array
              items:
                $ref: '#/components/schemas/Service'

paths:
  /packages:
    get:
      operationId: listPackages
      summary: List packages
      description: |
        Firestore query with filters.
        Client hook: `usePackages(filters)`
      security:
        - firebase: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PackageStatus'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/PackageType'
        - name: startAfter
          in: query
          schema:
            type: string
          description: Cursor for pagination
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Package list
          content:
            application/json:
              schema:
                type: object
                properties:
                  packages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Package'
                  nextCursor:
                    type: string

    post:
      operationId: createPackage
      summary: Create new package
      description: |
        Server Action: `createPackageAction`
        Requires: admin or staff role
      security:
        - firebase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePackageInput'
      responses:
        '200':
          description: Package created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      packageId:
                        type: string
                      slug:
                        type: string

  /packages/{packageId}:
    parameters:
      - name: packageId
        in: path
        required: true
        schema:
          type: string

    get:
      operationId: getPackage
      summary: Get package details
      description: |
        Firestore document read with services subcollection.
        Client hook: `usePackage(packageId)`
      security:
        - firebase: []
      responses:
        '200':
          description: Package with services
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageWithServices'
        '404':
          description: Package not found

    patch:
      operationId: updatePackage
      summary: Update package
      description: |
        Server Action: `updatePackageAction`
        Creates audit log entry.
      security:
        - firebase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePackageInput'
      responses:
        '200':
          description: Package updated

  /packages/{packageId}/status:
    parameters:
      - name: packageId
        in: path
        required: true
        schema:
          type: string

    post:
      operationId: updatePackageStatus
      summary: Change package status
      description: |
        Server Action: `updatePackageStatusAction`
        Validates state transitions.
        draft → active (publish)
        active → completed (after end date)
        any → cancelled
      security:
        - firebase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  $ref: '#/components/schemas/PackageStatus'
      responses:
        '200':
          description: Status updated
        '400':
          description: Invalid state transition

  /packages/{packageId}/services:
    parameters:
      - name: packageId
        in: path
        required: true
        schema:
          type: string

    post:
      operationId: addService
      summary: Add service to package
      description: |
        Server Action: `addServiceAction`
        Recalculates package totalPrice.
      security:
        - firebase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddServiceInput'
      responses:
        '200':
          description: Service added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      serviceId:
                        type: string
                      newTotalPrice:
                        type: number

  /packages/{packageId}/services/{serviceId}:
    parameters:
      - name: packageId
        in: path
        required: true
        schema:
          type: string
      - name: serviceId
        in: path
        required: true
        schema:
          type: string

    patch:
      operationId: updateService
      summary: Update service
      description: |
        Server Action: `updateServiceAction`
        Recalculates package totalPrice.
      security:
        - firebase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddServiceInput'
      responses:
        '200':
          description: Service updated

    delete:
      operationId: deleteService
      summary: Remove service from package
      description: |
        Server Action: `deleteServiceAction`
        Recalculates package totalPrice.
      security:
        - firebase: []
      responses:
        '200':
          description: Service deleted

  /packages/{packageId}/services/reorder:
    parameters:
      - name: packageId
        in: path
        required: true
        schema:
          type: string

    post:
      operationId: reorderServices
      summary: Reorder services
      description: |
        Server Action: `reorderServicesAction`
        Updates displayOrder for all services.
      security:
        - firebase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - serviceIds
              properties:
                serviceIds:
                  type: array
                  items:
                    type: string
                  description: Ordered list of service IDs
      responses:
        '200':
          description: Services reordered

  /packages/{packageId}/duplicate:
    parameters:
      - name: packageId
        in: path
        required: true
        schema:
          type: string

    post:
      operationId: duplicatePackage
      summary: Duplicate package
      description: |
        Server Action: `duplicatePackageAction`
        Creates copy with new name and draft status.
      security:
        - firebase: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name for duplicated package
      responses:
        '200':
          description: Package duplicated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      packageId:
                        type: string
