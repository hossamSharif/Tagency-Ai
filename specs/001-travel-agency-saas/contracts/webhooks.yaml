# Webhooks API Contract
# Travel Agency SaaS - External Webhook Endpoints

openapi: 3.1.0
info:
  title: Webhooks API
  version: 1.0.0
  description: |
    API Routes for external webhook integrations.
    Located in `src/app/api/webhooks/`

servers:
  - url: /api/webhooks
    description: Next.js API Routes

paths:
  /stripe:
    post:
      operationId: stripeWebhook
      summary: Stripe webhook handler
      description: |
        API Route: `/api/webhooks/stripe/route.ts`

        Handles Stripe events for both subscription billing
        and customer payments.

        Webhook signature verification required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Stripe event payload
      responses:
        '200':
          description: Webhook processed
        '400':
          description: Invalid signature
        '500':
          description: Processing error

      x-stripe-events:
        # Subscription events
        - event: checkout.session.completed
          description: |
            Customer completed subscription checkout.
            Actions:
            - Activate subscription
            - Update tenant status to 'active'
            - Send welcome/confirmation email
          handler: handleCheckoutComplete

        - event: customer.subscription.created
          description: |
            New subscription created.
            Actions:
            - Store Stripe subscription ID
            - Set current period dates
          handler: handleSubscriptionCreated

        - event: customer.subscription.updated
          description: |
            Subscription updated (renewal, plan change).
            Actions:
            - Update period dates
            - Handle plan changes
          handler: handleSubscriptionUpdated

        - event: customer.subscription.deleted
          description: |
            Subscription cancelled/expired.
            Actions:
            - Update subscription status to 'cancelled' or 'expired'
            - Restrict tenant access
            - Send cancellation notification
          handler: handleSubscriptionDeleted

        - event: invoice.payment_succeeded
          description: |
            Subscription invoice paid.
            Actions:
            - Record payment
            - Extend access period
          handler: handleInvoicePaymentSucceeded

        - event: invoice.payment_failed
          description: |
            Subscription payment failed.
            Actions:
            - Update subscription status to 'past_due'
            - Send payment failure notification
            - Schedule retry
          handler: handleInvoicePaymentFailed

        # Customer payment events (for invoice payments)
        - event: payment_intent.succeeded
          description: |
            Customer invoice payment succeeded.
            Actions:
            - Update invoice status
            - Update booking payment status
            - Send payment confirmation
          handler: handlePaymentIntentSucceeded

        - event: payment_intent.payment_failed
          description: |
            Customer payment failed.
            Actions:
            - Log failure
            - Notify customer
          handler: handlePaymentIntentFailed

      x-implementation:
        code: |
          // src/app/api/webhooks/stripe/route.ts
          import { headers } from 'next/headers';
          import Stripe from 'stripe';

          const stripe = new Stripe(process.env.STRIPE_SECRET_KEY!);
          const webhookSecret = process.env.STRIPE_WEBHOOK_SECRET!;

          export async function POST(request: Request) {
            const body = await request.text();
            const signature = headers().get('stripe-signature')!;

            let event: Stripe.Event;
            try {
              event = stripe.webhooks.constructEvent(body, signature, webhookSecret);
            } catch (err) {
              console.error('Webhook signature verification failed:', err);
              return new Response('Invalid signature', { status: 400 });
            }

            try {
              switch (event.type) {
                case 'checkout.session.completed':
                  await handleCheckoutComplete(event.data.object);
                  break;
                case 'customer.subscription.updated':
                  await handleSubscriptionUpdated(event.data.object);
                  break;
                case 'customer.subscription.deleted':
                  await handleSubscriptionDeleted(event.data.object);
                  break;
                case 'invoice.payment_failed':
                  await handleInvoicePaymentFailed(event.data.object);
                  break;
                case 'payment_intent.succeeded':
                  await handlePaymentIntentSucceeded(event.data.object);
                  break;
                default:
                  console.log(`Unhandled event: ${event.type}`);
              }

              return new Response('OK', { status: 200 });
            } catch (err) {
              console.error('Webhook processing error:', err);
              return new Response('Processing error', { status: 500 });
            }
          }

  /stripe/connect:
    post:
      operationId: stripeConnectWebhook
      summary: Stripe Connect webhook (future)
      description: |
        Reserved for future Stripe Connect integration
        if partner payouts are automated.
      responses:
        '200':
          description: Webhook processed

components:
  schemas:
    WebhookEvent:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        data:
          type: object
        created:
          type: integer

    WebhookLog:
      type: object
      description: |
        Stored in Firestore for debugging:
        `webhookLogs/{logId}`
      properties:
        id:
          type: string
        source:
          type: string
          enum: [stripe]
        eventType:
          type: string
        eventId:
          type: string
        payload:
          type: object
        status:
          type: string
          enum: [received, processed, failed]
        error:
          type: string
        processedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

x-webhook-security:
  stripe:
    description: |
      Stripe webhooks are verified using the webhook signing secret.

      Setup:
      1. Create webhook endpoint in Stripe Dashboard
      2. Add endpoint URL: https://yourdomain.com/api/webhooks/stripe
      3. Select events to receive
      4. Copy signing secret to STRIPE_WEBHOOK_SECRET env var

      Testing:
      - Use Stripe CLI: `stripe listen --forward-to localhost:3000/api/webhooks/stripe`
      - Trigger test events: `stripe trigger checkout.session.completed`

x-webhook-retry:
  description: |
    Stripe retries failed webhooks with exponential backoff.

    Best practices:
    - Return 200 quickly, process async if needed
    - Make handlers idempotent (check if already processed)
    - Store event ID to prevent duplicate processing
    - Log all events for debugging

x-environment-variables:
  - name: STRIPE_SECRET_KEY
    description: Stripe API secret key
    required: true
  - name: STRIPE_WEBHOOK_SECRET
    description: Webhook signing secret from Stripe Dashboard
    required: true
  - name: STRIPE_PUBLISHABLE_KEY
    description: Stripe publishable key for client-side
    required: true
